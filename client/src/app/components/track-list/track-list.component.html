@if(tracks) {
	<table class="table table-sm table-light table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Track</th>
				<th scope="col">Duration</th>
				<!--Use @if to hide if hideArtist is true-->
				@if (hideArtist != true){
					<th scope="col">Primary Artist</th>
				}
				<!--Use @if to hide if hideAlbum is true-->
				@if (hideAlbum != true){
					<th scope="col">Album</th>
				}
			</tr>
		</thead>
		<tbody>
			<!--@for to loop over tracks-->
			@for (t of tracks; track t.id; let idx = $index){
			<tr>
				<!--Populate with row index (start with 1!)-->
				<td>{{idx+1}}</td>
				<td>
					<!--link to the endpoint for that track, display the track's name-->
					<a [href]="'/track/' + t.id">{{t.name}}</a>
				</td>
				<!--display the track's duration-->
				<td>{{t.durationStr}}</td>
				<!--hide if hideArtist is true; link to the first artist's endpoint and display the first artist's name-->
				@if (hideArtist == false){
					<td><a [href]="'/artist/' + t.artists[0].id">{{t.artists[0].name}}</a></td>
				}
				<!--hide if hideAlbum is true; link to the album's endpoint and display the album's name-->
				@if (hideAlbum == false){
					<td><a [href]="'/album/' + t.album.id">{{t.album.name}}</a></td>
				}
			</tr>
			}
		</tbody>
	</table>
}
